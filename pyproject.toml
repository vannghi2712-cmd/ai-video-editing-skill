[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-video-editor"
version = "0.1.0"
description = "Automated short-form video editing pipeline for TikTok content."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Van Nghi Nguyen", email = "vannghi2712@gmail.com" }]
dependencies = []

# Optional transcription dependencies — install in .venv-whisperx ONLY.
# NOT part of the mandatory base runtime. See requirements/transcription-windows-cpu.lock.txt.
[project.optional-dependencies]
transcription = [
    "whisperx==3.8.6",
]
dev = [
    "pytest",
]
test = [
    "jsonschema==4.26.0",
]
# Optional OpenAI Vision adapter — lazy-imported, NEVER part of mandatory runtime.
# Install only when using --provider openai.
vision-openai = [
    "openai==3.8.0",
]

[project.scripts]
auto-video-editor = "auto_video_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
