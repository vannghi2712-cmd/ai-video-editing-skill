[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-video-editor"
version = "0.1.0"
description = "Automated short-form video editing pipeline for TikTok content."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Van Nghi Nguyen", email = "vannghi2712@gmail.com" }]
dependencies = []

[project.scripts]
auto-video-editor = "auto_video_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
